apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketclasses.objectstorage.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only"
spec:
  group: objectstorage.k8s.io
  names:
    kind: BucketClass
    listKind: BucketClassList
    plural: bucketclasses
    singular: bucketclass
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            driverName:
              type: string
            backend:
              type: string
              description: >-
                Object storage implementation. MinIO (default) or AWS.
              enum: [MinIO, AWS]
            deletionPolicy:
              type: string
              enum: [Delete, Retain]
              default: Retain
            objectLockingEnabled:
              type: boolean
              default: false
            retentionMode:
              type: string
              enum: [GOVERNANCE, COMPLIANCE]
            retentionDays:
              type: integer
            parameters:
              type: object
              additionalProperties:
                type: string
            bucketPolicyRef:
              type: object
              description: >-
                Optional reference to a JSON bucket policy document to apply (backend=AWS). Kind is
                ConfigMap or Secret; `key` selects the entry containing the JSON policy.
              properties:
                kind:
                  type: string
                  enum: [ConfigMap, Secret]
                namespace:
                  type: string
                name:
                  type: string
                key:
                  type: string
            minioCredentialSecretRef:
              type: object
              description: >-
                Secret (namespace + name) with MinIO admin keys (MINIO_ENDPOINT, MINIO_ACCESS_KEY,
                MINIO_SECRET_KEY, optional MINIO_USE_SSL). If unset, operator uses its Deployment env.
              properties:
                name:
                  type: string
                namespace:
                  type: string
            awsCredentialSecretRef:
              type: object
              description: >-
                Secret (namespace + name) with AWS credentials/config (AWS_REGION, AWS_ACCESS_KEY_ID,
                AWS_SECRET_ACCESS_KEY, optional AWS_S3_ENDPOINT). Used when backend=AWS.
              properties:
                name:
                  type: string
                namespace:
                  type: string
