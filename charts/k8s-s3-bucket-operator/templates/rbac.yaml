apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8s-s3-bucket-operator.clusterRoleName" . }}
  labels:
    {{- include "k8s-s3-bucket-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketclaims", "bucketclaims/status", "bucketclasses", "bucketclasses/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8s-s3-bucket-operator.clusterRoleBindingName" . }}
  labels:
    {{- include "k8s-s3-bucket-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "k8s-s3-bucket-operator.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-s3-bucket-operator.serviceAccountName" . }}
    namespace: {{ include "k8s-s3-bucket-operator.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "k8s-s3-bucket-operator.fullname" . }}-leader-election
  namespace: {{ include "k8s-s3-bucket-operator.namespace" . }}
  labels:
    {{- include "k8s-s3-bucket-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "k8s-s3-bucket-operator.fullname" . }}-leader-election
  namespace: {{ include "k8s-s3-bucket-operator.namespace" . }}
  labels:
    {{- include "k8s-s3-bucket-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "k8s-s3-bucket-operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "k8s-s3-bucket-operator.serviceAccountName" . }}
    namespace: {{ include "k8s-s3-bucket-operator.namespace" . }}
