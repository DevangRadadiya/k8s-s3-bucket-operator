{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-s3-bucket-operator.fullname" . }}-metrics
  namespace: {{ include "k8s-s3-bucket-operator.namespace" . }}
  labels:
    {{- include "k8s-s3-bucket-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "k8s-s3-bucket-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
