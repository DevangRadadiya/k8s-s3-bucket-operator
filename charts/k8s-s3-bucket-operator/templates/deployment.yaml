apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "k8s-s3-bucket-operator.fullname" . }}
  namespace: {{ include "k8s-s3-bucket-operator.namespace" . }}
  labels:
    {{- include "k8s-s3-bucket-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "k8s-s3-bucket-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "k8s-s3-bucket-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "k8s-s3-bucket-operator.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "k8s-s3-bucket-operator.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.leaderElection.enabled }}
          args:
            - "--leader-elect=true"
          {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.cosi.enabled }}
          volumeMounts:
            - name: cosi-socket
              mountPath: {{ .Values.cosi.socketDir }}
          {{- end }}
          env:
            {{- if .Values.cosi.enabled }}
            - name: COSI_ENABLED
              value: "true"
            - name: COSI_DRIVER_NAME
              value: {{ .Values.cosi.driverName | quote }}
            - name: COSI_SOCKET_PATH
              value: {{ printf "%s/%s" .Values.cosi.socketDir .Values.cosi.socketFile | quote }}
            {{- end }}
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-s3-bucket-operator.minioSecretName" . }}
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-s3-bucket-operator.minioSecretName" . }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-s3-bucket-operator.minioSecretName" . }}
                  key: MINIO_SECRET_KEY
            - name: MINIO_USE_SSL
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-s3-bucket-operator.minioSecretName" . }}
                  key: MINIO_USE_SSL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- if .Values.cosi.enabled }}
        - name: objectstorage-sidecar
          image: {{ .Values.cosi.sidecar.image }}
          imagePullPolicy: {{ .Values.cosi.sidecar.imagePullPolicy }}
          args:
            - "--driver-addr=unix://{{ .Values.cosi.socketDir }}/{{ .Values.cosi.socketFile }}"
            - "--v=3"
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: cosi-socket
              mountPath: {{ .Values.cosi.socketDir }}
          resources:
            {{- toYaml .Values.cosi.sidecar.resources | nindent 12 }}
        {{- end }}
      {{- if .Values.cosi.enabled }}
      volumes:
        - name: cosi-socket
          emptyDir: {}
      {{- end }}
