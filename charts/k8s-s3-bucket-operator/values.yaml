# Default values — override for production (especially MinIO credentials).

# Create release namespace (Namespace resource)
namespace:
  create: true
  name: k8s-s3-bucket-operator

nameOverride: ""
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/devangradadiya/k8s-s3-bucket-operator
  # When empty, Chart.appVersion is used
  tag: ""
  pullPolicy: Always

serviceAccount:
  create: true
  name: ""

# Operator container
leaderElection:
  enabled: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# MinIO connection — prefer existingSecret in production
minio:
  # If set, chart does not create a Secret; Deployment uses this name
  existingSecret: ""
  # Name of Secret holding MINIO_* keys (created by chart or pre-provisioned)
  secretName: minio-credentials
  # When existingSecret is empty and createSecret is true, chart creates Secret
  createSecret: true
  endpoint: minio.minio-ns.svc.cluster.local:9000
  accessKey: minioadmin
  secretKey: minioadmin
  useSSL: "false"

# Cluster-scoped RBAC resource names (unique per release if you change fullnameOverride)
rbac:
  clusterRoleName: ""
  clusterRoleBindingName: ""

# Prometheus metrics (controller-runtime); scrape path is /metrics on port 8080
metrics:
  service:
    enabled: true
    port: 8080

# Keep at least one pod up during voluntary disruptions (matches HA + leader election)
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# COSI (Container Object Storage Interface) — optional; disabled by default to preserve Wave 1 behavior.
cosi:
  enabled: false
  driverName: k8s-s3-bucket-operator
  socketDir: /var/lib/cosi
  socketFile: cosi.sock

  # Provisioner sidecar (talks to the in-process gRPC COSI driver via a shared Unix socket).
  sidecar:
    # NOTE: "canary" tag appears to be missing in some environments; use a pinned tag instead.
    image: gcr.io/k8s-staging-sig-storage/objectstorage-sidecar:v20240513-v0.1.0-35-gefb3255
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  # Upstream COSI controller (watches BucketClaim and creates Bucket objects).
  controller:
    enabled: true
    image: quay.io/containerobjectstorage/objectstorage-controller:canary
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
