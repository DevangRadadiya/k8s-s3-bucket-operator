apiVersion: v1
kind: Namespace
metadata:
  name: k8s-s3-bucket-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-s3-bucket-operator
  namespace: k8s-s3-bucket-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-s3-bucket-operator-role
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketclaims", "bucketclaims/status", "bucketclasses", "bucketclasses/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-s3-bucket-operator-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-s3-bucket-operator-role
subjects:
  - kind: ServiceAccount
    name: k8s-s3-bucket-operator
    namespace: k8s-s3-bucket-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: k8s-s3-bucket-operator
type: Opaque
stringData:
  # Replace these values before deploying
  MINIO_ENDPOINT: "minio.minio-ns.svc.cluster.local:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin"
  MINIO_USE_SSL: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-s3-bucket-operator
  namespace: k8s-s3-bucket-operator
  labels:
    app: k8s-s3-bucket-operator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-s3-bucket-operator
  template:
    metadata:
      labels:
        app: k8s-s3-bucket-operator
    spec:
      serviceAccountName: k8s-s3-bucket-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          args:
            - "--leader-elect=true"
          image: ghcr.io/devangradadiya/k8s-s3-bucket-operator:main
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: MINIO_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ENDPOINT
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_SECRET_KEY
            - name: MINIO_USE_SSL
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_USE_SSL
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-s3-bucket-operator-leader-election-role
  namespace: k8s-s3-bucket-operator
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-s3-bucket-operator-leader-election-rolebinding
  namespace: k8s-s3-bucket-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-s3-bucket-operator-leader-election-role
subjects:
  - kind: ServiceAccount
    name: k8s-s3-bucket-operator
    namespace: k8s-s3-bucket-operator
