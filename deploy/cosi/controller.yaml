apiVersion: v1
kind: ServiceAccount
metadata:
  name: objectstorage-controller-sa
  namespace: k8s-s3-bucket-operator
  labels:
    app.kubernetes.io/part-of: container-object-storage-interface
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: container-object-storage-interface-controller
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectstorage-controller-role
  labels:
    app.kubernetes.io/part-of: container-object-storage-interface
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: container-object-storage-interface-controller
rules:
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketclaims", "bucketaccesses", "bucketclaims/status", "bucketaccesses/status"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["buckets"]
    verbs: ["get", "list", "watch", "update", "create", "delete"]
  - apiGroups: ["objectstorage.k8s.io"]
    resources: ["bucketclasses", "bucketaccessclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts"]
    verbs: ["list", "get"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectstorage-controller
  labels:
    app.kubernetes.io/part-of: container-object-storage-interface
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: container-object-storage-interface-controller
subjects:
  - kind: ServiceAccount
    name: objectstorage-controller-sa
    namespace: k8s-s3-bucket-operator
roleRef:
  kind: ClusterRole
  name: objectstorage-controller-role
  apiGroup: rbac.authorization.k8s.io
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectstorage-controller
  namespace: k8s-s3-bucket-operator
  labels:
    app.kubernetes.io/part-of: container-object-storage-interface
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: container-object-storage-interface-controller
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: objectstorage-controller
  namespace: k8s-s3-bucket-operator
  labels:
    app.kubernetes.io/part-of: container-object-storage-interface
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: container-object-storage-interface-controller
subjects:
  - kind: ServiceAccount
    name: objectstorage-controller-sa
    namespace: k8s-s3-bucket-operator
roleRef:
  kind: Role
  name: objectstorage-controller
  apiGroup: rbac.authorization.k8s.io
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: objectstorage-controller
  namespace: k8s-s3-bucket-operator
  labels:
    app.kubernetes.io/part-of: container-object-storage-interface
    app.kubernetes.io/component: controller
    app.kubernetes.io/name: container-object-storage-interface-controller
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/part-of: container-object-storage-interface
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: container-object-storage-interface-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: container-object-storage-interface
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: container-object-storage-interface-controller
    spec:
      serviceAccountName: objectstorage-controller-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: objectstorage-controller
          image: quay.io/containerobjectstorage/objectstorage-controller:canary
          imagePullPolicy: IfNotPresent
          args:
            - "--v=3"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
