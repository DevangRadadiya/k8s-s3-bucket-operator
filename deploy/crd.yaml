apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketclaims.objectstorage.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only"
spec:
  group: objectstorage.k8s.io
  names:
    kind: BucketClaim
    listKind: BucketClaimList
    plural: bucketclaims
    singular: bucketclaim
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - bucketClassName
              properties:
                bucketClassName:
                  type: string
                protocols:
                  type: array
                  items:
                    type: string
                bucketName:
                  type: string
            status:
              type: object
              properties:
                secretReference:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                endpoint:
                  type: string
                bucketName:
                  type: string
                phase:
                  type: string
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: bucketclasses.objectstorage.k8s.io
  annotations:
    api-approved.kubernetes.io: "unapproved, experimental-only"
spec:
  group: objectstorage.k8s.io
  names:
    kind: BucketClass
    listKind: BucketClassList
    plural: bucketclasses
    singular: bucketclass
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            driverName:
              type: string
            deletionPolicy:
              type: string
              enum: [Delete, Retain]
            parameters:
              type: object
              additionalProperties:
                type: string
