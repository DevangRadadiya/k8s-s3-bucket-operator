# BucketClass — created once by cluster admin per MinIO backend
# Defines which driver handles provisioning and what parameters to use
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClass
metadata:
  name: minio-standard
driverName: k8s-s3-bucket-operator
deletionPolicy: Delete
objectLockingEnabled: true
retentionMode: GOVERNANCE
retentionDays: 30
parameters:
  region: "us-east-1"
  # MinIO admin credentials: default = operator Deployment MINIO_* env.
  # For a different MinIO per class, create a Secret with MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY / MINIO_USE_SSL and reference it:
  # minioCredentialSecretRef:
  #   namespace: minio-ns
  #   name: minio-admin-other
