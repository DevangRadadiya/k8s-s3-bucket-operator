# BucketClaim — created by developers, one per app bucket
# The operator will automatically:
#   1. Create the bucket in MinIO
#   2. Create a scoped user + policy
#   3. Store credentials in a Secret named "<claim-name>-credentials"
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: my-app-images
  namespace: my-app
spec:
  bucketClassName: minio-standard
  bucketName: my-v120-test-bucket
  protocols:
    - S3
  quota: "50Gi"
  accessType: ReadOnly
  lifecycleRules:
    - id: ExpireOldBackups
      status: Enabled
      prefix: backups/
      expiration:
        days: 30
  replicationTarget:
    endpoint: minio.minio-ns.svc.cluster.local:9000
    bucketName: my-v120-test-bucket-replica
    accessKey: minioadmin
    secretKey: minioadmin
    useSSL: false
