name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-lint:
    name: Unit + Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: make lint

      - name: Go test
        run: go test ./... -v -coverprofile=coverage.out

  e2e-kind:
    name: E2E (kind, Kubernetes)
    runs-on: ubuntu-latest
    needs: unit-lint
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup kind
        uses: helm/kind-action@v1.10.0

      - name: Build operator image
        run: |
          docker build -t k8s-s3-bucket-operator:test .
          kind load docker-image k8s-s3-bucket-operator:test

      - name: Run E2E
        env:
          OPERATOR_IMAGE: k8s-s3-bucket-operator:test
        run: ./test/e2e/run.sh k8s

