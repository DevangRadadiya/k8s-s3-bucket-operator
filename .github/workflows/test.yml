name: Test

# Opt into Node 24 for JS-based actions (see GitHub deprecation of Node 20 runners).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-lint:
    name: Unit + Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Go vet
        run: make lint

      - name: Go test
        run: go test ./... -v -coverprofile=coverage.out

  e2e-kind:
    name: E2E (kind, Kubernetes)
    runs-on: ubuntu-latest
    needs: unit-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Default cluster name is chart-testing; `kind load` defaults to cluster "kind" and would miss the image.
      - name: Setup kind
        uses: helm/kind-action@v1.14.0

      - name: Build and load operator image into kind
        run: |
          docker build -t k8s-s3-bucket-operator:test .
          echo "Kind clusters:" && kind get clusters
          for c in $(kind get clusters); do
            echo "Loading image into cluster: $c"
            kind load docker-image k8s-s3-bucket-operator:test --name "$c"
          done

      - name: Run E2E
        env:
          OPERATOR_IMAGE: k8s-s3-bucket-operator:test
        run: ./test/e2e/run.sh k8s

