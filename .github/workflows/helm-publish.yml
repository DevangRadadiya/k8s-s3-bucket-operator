name: Publish Helm chart (OCI)

on:
  push:
    branches:
      - main
    paths:
      - "charts/k8s-s3-bucket-operator/**"
      - ".github/workflows/helm-publish.yml"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  helm_push:
    name: Package and push chart to GHCR (OCI)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint chart
        run: helm lint charts/k8s-s3-bucket-operator

      - name: Package chart
        run: |
          mkdir -p /tmp/chart-out
          helm package charts/k8s-s3-bucket-operator --destination /tmp/chart-out

      - name: Log in to ghcr.io (Helm OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push chart to OCI
        env:
          # Lowercase owner required for GHCR
          OCI_REGISTRY: ghcr.io/${{ github.repository_owner }}/helm-charts
        run: |
          REG=$(echo "$OCI_REGISTRY" | tr '[:upper:]' '[:lower:]')
          helm push /tmp/chart-out/k8s-s3-bucket-operator-*.tgz "oci://${REG}"
