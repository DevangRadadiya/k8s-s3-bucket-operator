name: Bug report
description: Report unexpected operator or CRD behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill this out. **Do not use this form for security issues** — see [SECURITY.md](https://github.com/DevangRadadiya/k8s-s3-bucket-operator/blob/main/SECURITY.md).

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: YAML snippets, kubectl commands, and operator logs help.
      placeholder: |
        1. kubectl apply -f ...
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Operator image / version
      description: e.g. ghcr.io/devangradadiya/k8s-s3-bucket-operator:latest digest or tag
    validations:
      required: false

  - type: input
    id: k8s
    attributes:
      label: Kubernetes / OpenShift version
      placeholder: e.g. v1.29.0 / 4.15
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs (sanitized)
      description: Operator pod logs, relevant events — remove secrets.
    validations:
      required: false
